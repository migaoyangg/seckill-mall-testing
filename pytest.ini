[pytest]
testpaths = tests/api
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s - %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: 核心只读与主流程冒烟用例
    regression: 完整接口回归用例
    destructive: 会创建或修改业务数据的用例
    seckill: 秒杀业务用例
    data_validation: 包含 MySQL 或 Redis 数据一致性校验的用例

