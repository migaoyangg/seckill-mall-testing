services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CI_MYSQL_PASSWORD:?CI_MYSQL_PASSWORD is required}
      MYSQL_DATABASE: seckill_mall
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${CI_REDIS_PASSWORD:?CI_REDIS_PASSWORD is required}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${CI_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${CI_RABBITMQ_USERNAME:?CI_RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${CI_RABBITMQ_PASSWORD:?CI_RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
