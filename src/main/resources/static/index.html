<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秒杀商城 | 精选好物，限时直降</title>
  <style>
    :root{--ink:#172033;--muted:#687386;--line:#e6eaf0;--canvas:#f5f7fa;--surface:#fff;--brand:#0f766e;--brand-dark:#115e59;--hot:#d97706;--danger:#c2410c;--radius:8px;--shadow:0 8px 24px rgba(23,32,51,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .top{background:#111827;color:#e5e7eb}.topbar,.nav,.wrap{max-width:1180px;margin:auto}.topbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px}.topbar span{color:#9ca3af}.nav{height:68px;display:flex;align-items:center;gap:30px;padding:0 20px}.brand{font-weight:800;font-size:20px;letter-spacing:.5px;color:#fff;white-space:nowrap}.brand b{color:#f59e0b}.navlinks{display:flex;gap:22px;color:#aeb8c8}.navlinks button{background:none;border:0;color:inherit;padding:8px 0}.navlinks button.active,.navlinks button:hover{color:#fff;border-bottom:2px solid #f59e0b}.account{margin-left:auto;display:flex;align-items:center;gap:10px}.account button{border:1px solid #495467;border-radius:6px;background:transparent;color:#fff;padding:6px 12px}.account .primary{background:#f59e0b;border-color:#f59e0b;color:#111827;font-weight:700}.search{background:var(--surface);border-bottom:1px solid var(--line)}.searchin{max-width:1180px;margin:auto;padding:18px 20px;display:flex;gap:10px}.searchin input{flex:1;border:1px solid #cfd6e1;border-radius:6px;padding:11px 14px;outline:0}.searchin input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #ccfbf1}.searchin button,.btn{border:0;border-radius:6px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:700}.searchin button:hover,.btn:hover{background:var(--brand-dark)}.wrap{padding:24px 20px 60px}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:22px}.hero-main{background:#173b52;color:#fff;border-radius:var(--radius);padding:30px;min-height:180px;display:flex;flex-direction:column;justify-content:center}.hero-main h1{margin:0 0 8px;font-size:30px;line-height:1.2}.hero-main p{margin:0;color:#d5e4ed;max-width:460px}.hero-main .btn{align-self:flex-start;margin-top:20px;background:#f59e0b;color:#172033}.hero-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}.hero-side strong{font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{border-left:3px solid #f59e0b;padding-left:10px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;margin:8px 0 16px}.toolbar h2{font-size:20px;margin:0}.toolbar .grow{flex:1}.toolbar select,.filter{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;color:var(--muted)}.chips{display:flex;gap:8px;margin:0 0 18px;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;color:var(--muted)}.chip.active,.chip:hover{border-color:var(--brand);color:var(--brand);background:#ecfdf5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;display:flex;flex-direction:column}.product:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.product-media{height:180px;background:#e9eef2;display:flex;align-items:center;justify-content:center;overflow:hidden}.product-media img{width:100%;height:100%;object-fit:cover}.product-media .fallback{font-size:48px;color:#8291a3}.product-body{padding:14px;display:flex;flex-direction:column;flex:1}.product h3{font-size:15px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product p{color:var(--muted);font-size:12px;margin:0 0 12px;min-height:38px}.price{font-size:22px;color:var(--danger);font-weight:800}.price small{font-size:12px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:8px 0 12px}.product .btn{width:100%;margin-top:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}.hidden{display:none!important}.seckill-list{display:grid;gap:14px}.sale{border:1px solid #f3d6ad;border-left:4px solid var(--hot);background:#fffdf8;border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:170px 1fr auto;gap:18px;align-items:center}.sale-media{height:125px;background:#fef3c7;display:flex;align-items:center;justify-content:center;overflow:hidden}.sale-media img{width:100%;height:100%;object-fit:cover}.sale-media span{font-size:40px}.sale h3{margin:0 0 8px;font-size:18px}.sale .sale-price{font-size:28px;color:var(--danger);font-weight:800}.sale del{color:var(--muted);margin-left:8px}.sale-meta{color:var(--muted);margin-top:8px}.sale .btn{white-space:nowrap;background:var(--hot)}.sale .btn:disabled{background:#cbd5e1}.orders{overflow:auto}.order{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:12px;padding:16px;display:grid;grid-template-columns:1.2fr 1.2fr .7fr .8fr auto;gap:12px;align-items:center}.order small,.muted{color:var(--muted)}.order strong{display:block}.tag{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;background:#eef2f7;color:#475569}.tag.wait{background:#fff7ed;color:#c2410c}.tag.ok{background:#ecfdf5;color:#047857}.tag.bad{background:#fff1f2;color:#be123c}.order-actions{display:flex;gap:6px}.btn.ghost{background:#fff;color:var(--brand);border:1px solid #9adbd4}.btn.warn{background:#d97706}.admin-grid{display:grid;grid-template-columns:300px 1fr;gap:20px}.form{display:grid;gap:8px}.form label{font-size:12px;color:var(--muted);font-weight:700}.form input,.form select{width:100%;border:1px solid var(--line);padding:9px;border-radius:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:700}.empty{text-align:center;padding:54px 20px;color:var(--muted)}.loading{text-align:center;padding:40px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:6px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.dialog{background:#fff;border-radius:var(--radius);width:min(520px,100%);max-height:90vh;overflow:auto;padding:24px;position:relative}.dialog h2{margin:0 0 18px}.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:22px;color:var(--muted)}.dialog .form{gap:12px}.detail{display:grid;grid-template-columns:180px 1fr;gap:18px}.detail-media{height:180px;background:#e9eef2;display:flex;align-items:center;justify-content:center;overflow:hidden}.detail-media img{width:100%;height:100%;object-fit:cover}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px}.qty input{width:50px;text-align:center;border:1px solid var(--line);padding:5px}.poll{margin-top:14px;padding:12px;background:#f8fafc;border-radius:6px;color:var(--muted)}
    .sale-countdown{display:inline-block;margin-top:8px;color:var(--hot);font-weight:800;font-variant-numeric:tabular-nums}.sale-countdown.ended{color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.order{grid-template-columns:1fr 1fr}.order-actions{grid-column:1/-1}.sale{grid-template-columns:120px 1fr}.sale .btn{grid-column:2;justify-self:start}}
    @media(max-width:600px){.nav{height:auto;padding:14px 16px;flex-wrap:wrap;gap:14px}.navlinks{order:3;width:100%;overflow:auto;gap:18px}.account{margin-left:auto}.searchin,.wrap{padding-left:14px;padding-right:14px}.hero-main h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.product-media{height:135px}.product-body{padding:11px}.product h3{font-size:14px}.price{font-size:18px}.toolbar{flex-wrap:wrap}.toolbar .grow{display:none}.sale{grid-template-columns:1fr}.sale-media{height:150px}.sale .btn{grid-column:auto}.detail{grid-template-columns:1fr}.topbar{padding:0 14px}}
  </style>
</head>
<body>
  <div class="top"><div class="topbar"><span>精选好物 · 安全交易 · 快速发货</span><span id="welcome">欢迎来到秒杀商城</span></div><div class="nav"><div class="brand"><b>⚡</b> 秒杀商城</div><div class="navlinks"><button class="active" data-tab="products">商品</button><button data-tab="seckill">限时秒杀</button><button data-tab="orders">我的订单</button><button data-tab="admin" id="adminNav" class="hidden">运营中心</button></div><div class="account"><span id="userName"></span><button id="loginBtn" class="primary">登录</button><button id="registerBtn">注册</button><button id="logoutBtn" class="hidden">退出</button></div></div></div>
  <div class="search"><div class="searchin"><input id="search" placeholder="搜索商品名称或品牌，试试 iPhone"><button id="searchBtn">搜索</button></div></div>
  <main class="wrap">
    <section class="hero"><div class="hero-main"><h1>每日精选，限时直降</h1><p>从日常好物到热门数码，库存实时同步，订单状态全程可追踪。</p><button class="btn" id="heroSeckill">查看限时秒杀</button></div><div class="hero-side"><strong>今日运营概览</strong><div class="stats"><div class="stat"><b id="statProducts">-</b><small>在售商品</small></div><div class="stat"><b id="statSales">-</b><small>累计销量</small></div><div class="stat"><b id="statDeals">-</b><small>进行中活动</small></div></div></div></section>
    <section id="productsView"><div class="toolbar"><h2>精选商品</h2><span class="grow"></span><select id="sort"><option value="createTime">最新上架</option><option value="sales">销量优先</option><option value="priceAsc">价格从低到高</option><option value="priceDesc">价格从高到低</option></select></div><div class="chips"><button class="chip active" data-category="">全部</button><button class="chip" data-category="2">手机通讯</button><button class="chip" data-category="3">电脑办公</button><button class="chip" data-category="1">数码电子</button><button class="chip" data-category="4">家用电器</button></div><div id="products" class="grid"><div class="loading">正在加载商品…</div></div></section>
    <section id="seckillView" class="panel hidden"><div class="toolbar"><h2>限时秒杀</h2><span class="grow muted">先到先得，活动库存实时更新</span><button class="btn ghost" id="refreshSale">刷新库存</button></div><div id="seckill" class="seckill-list"><div class="loading">正在加载活动…</div></div></section>
    <section id="ordersView" class="panel hidden"><div class="toolbar"><h2>我的订单</h2><span class="grow"></span><select id="orderStatus"><option value="">全部状态</option><option value="0">待支付</option><option value="1">已支付</option><option value="4">已取消</option><option value="5">超时关闭</option><option value="7">已退款</option></select><button class="btn ghost" id="refreshOrders">刷新</button></div><div id="orders" class="orders"><div class="empty">登录后查看订单</div></div></section>
    <section id="adminView" class="panel hidden"><div class="toolbar"><h2>运营中心</h2><span class="grow muted">商品、秒杀活动和订单统一管理</span><button class="btn ghost" id="refreshAdmin">刷新数据</button></div><div class="admin-grid"><div><h3>创建秒杀活动</h3><div class="form"><label>商品</label><select id="saleProduct"></select><label>秒杀价格</label><input id="salePrice" type="number" min=".01" step=".01"><label>秒杀库存</label><input id="saleStock" type="number" min="1"><label>开始时间</label><input id="saleStart" type="datetime-local"><label>结束时间</label><input id="saleEnd" type="datetime-local"><label>每人限购</label><input id="saleLimit" type="number" min="1" value="1"><button class="btn" id="createSale">创建活动</button></div></div><div><h3>商品状态</h3><div id="adminProducts"><div class="loading">正在加载…</div></div><h3 style="margin-top:24px">最近订单</h3><div id="adminOrders"><div class="loading">正在加载…</div></div></div></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <div id="authModal" class="modal"><div class="dialog"><button class="close" data-close="authModal">×</button><h2 id="authTitle">登录账号</h2><div class="form"><input id="authUser" placeholder="用户名"><input id="authPassword" type="password" placeholder="密码"><input id="authNickname" class="hidden" placeholder="昵称（可选）"><input id="authPhone" class="hidden" placeholder="手机号"><button class="btn" id="authSubmit">登录</button><button class="btn ghost" id="authSwitch">没有账号？去注册</button></div></div></div>
  <div id="detailModal" class="modal"><div class="dialog"><button class="close" data-close="detailModal">×</button><div id="detailContent"></div></div></div>
  <script>
    const API='/api';let token=localStorage.getItem('seckill_token'),user=null,products=[],mode='login',category='',pollTimers=[];
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    async function request(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;try{const r=await fetch(API+path,{...opt,headers});return await r.json()}catch(e){return{code:500,message:'网络连接失败，请确认服务已启动'}}}
    function toast(msg,type='info'){const e=$('#toast');e.textContent=msg;e.className='toast show';if(type==='error')e.style.background='#b42318';if(type==='success')e.style.background='#047857';setTimeout(()=>e.className='toast',3000)}
    function img(url,alt=''){return url?`<img src="${url}" alt="${alt}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" ><span class="fallback" style="display:none">▣</span>`:'<span class="fallback">▣</span>'}
    function show(id){$('#'+id).classList.add('show')}function hide(id){$('#'+id).classList.remove('show')}
    function setUser(){const logged=!!user;$('#userName').textContent=logged?(user.nickname||user.username):'';$('#loginBtn').classList.toggle('hidden',logged);$('#registerBtn').classList.toggle('hidden',logged);$('#logoutBtn').classList.toggle('hidden',!logged);$('#adminNav').classList.toggle('hidden',!user||user.role!==1);$('#welcome').textContent=logged?'你好，'+(user.nickname||user.username):'欢迎来到秒杀商城'}
    async function boot(){if(token){const r=await request('/user/info');if(r.code===200){user=r.data}else{token=null;localStorage.removeItem('seckill_token')}}setUser();await Promise.all([loadProducts(),loadSales()]);if(user?.role===1)loadAdmin()}
    async function loadProducts(){let p=new URLSearchParams({page:1,size:20});if($('#search').value.trim())p.set('keyword',$('#search').value.trim());if(category)p.set('categoryId',category);const s=$('#sort').value;if(s==='priceAsc'){p.set('sortBy','price');p.set('sortOrder','asc')}else if(s==='priceDesc'){p.set('sortBy','price');p.set('sortOrder','desc')}else if(s==='sales'){p.set('sortBy','sales');p.set('sortOrder','desc')}const r=await request('/product/list?'+p);if(r.code!==200)return;products=r.data.records||[];$('#products').innerHTML=products.length?products.map(p=>`<article class="product"><div class="product-media">${img(p.mainImage,p.name)}</div><div class="product-body"><h3 title="${p.name}">${p.name}</h3><p>${p.description||p.brand||'精选商品'}</p><div class="price"><small>¥</small>${p.price}</div><div class="meta"><span>库存 ${p.stock}</span><span>销量 ${p.sales}</span></div><button class="btn" data-detail="${p.id}">查看商品</button></div></article>`).join(''):'<div class="empty">暂无匹配商品</div>';$('#statProducts').textContent=products.length;$('#statSales').textContent=products.reduce((n,p)=>n+(p.sales||0),0)}
    async function loadSales(){const r=await request('/seckill/list?page=1&size=20');if(r.code!==200)return;const list=r.data.records||[];$('#statDeals').textContent=list.filter(x=>x.status===1).length;pollTimers.forEach(clearInterval);pollTimers=[];$('#seckill').innerHTML=list.length?list.map((s,i)=>`<article class="sale"><div class="sale-media">${img(s.productImage,s.productName)}<span>⚡</span></div><div><h3>${s.productName||'秒杀商品'}</h3><div><span class="sale-price">¥${s.seckillPrice}</span><del>¥${s.originalPrice}</del></div><div class="sale-meta">剩余 ${s.remainStock} 件 · ${s.discount||''} · ${s.statusDesc||''}</div></div><button class="btn" data-seckill="${s.id}" ${s.status!==1||s.remainStock<1?'disabled':''}>${s.status===1?(s.remainStock<1?'已售罄':'立即秒杀'):(s.status===0?'即将开始':'已结束')}</button></article>`).join(''):'<div class="empty">暂无秒杀活动</div>'}
    async function detail(id){const p=products.find(x=>x.id==id);if(!p)return;$('#detailContent').innerHTML=`<div class="detail"><div class="detail-media">${img(p.mainImage,p.name)}</div><div><h2>${p.name}</h2><p class="muted">${p.description||'精选商品'} · ${p.brand||'官方精选'}</p><div class="price">¥${p.price}</div><p class="muted">库存 ${p.stock} · 已售 ${p.sales}</p><div class="qty"><button data-qty="-1">−</button><input id="quantity" value="1" min="1" type="number"><button data-qty="1">+</button></div><button class="btn" style="margin-top:16px;width:100%" data-buy="${p.id}">立即下单</button></div></div>`;show('detailModal')}
    async function buy(id){if(!token){showAuth('login');return}const q=Math.max(1,Number($('#quantity').value||1));const r=await request(`/order/create?productId=${id}&quantity=${q}`,{method:'POST'});if(r.code===200){hide('detailModal');toast('订单已创建，请及时支付','success');loadProducts();loadOrders()}else toast(r.message||'下单失败','error')}
    async function doSale(id,btn){if(!token){showAuth('login');return}btn.disabled=true;btn.textContent='受理中…';const r=await request('/seckill/do/'+id,{method:'POST'});if(r.code!==200){toast(r.message||'秒杀失败','error');btn.disabled=false;btn.textContent='立即秒杀';return}const rid=r.data.requestId;toast('已受理，正在创建订单','success');let tries=0;const timer=setInterval(async()=>{const x=await request('/seckill/result/'+rid);tries++;if(x.code===200&&x.data.status==='SUCCESS'){clearInterval(timer);toast('秒杀成功，订单待支付','success');loadSales();loadOrders()}else if(x.code===200&&x.data.status==='FAIL'||tries>12){clearInterval(timer);toast(x.data?.message||'订单创建失败','error');loadSales()}},700);pollTimers.push(timer)}
    const status={0:['待支付','wait'],1:['已支付','ok'],2:['已发货','ok'],3:['已完成','ok'],4:['已取消','bad'],5:['超时关闭','bad'],6:['退款中','wait'],7:['已退款','ok']};
    async function loadOrders(){if(!token){$('#orders').innerHTML='<div class="empty">登录后查看订单</div>';return}let q=$('#orderStatus').value;const r=await request('/order/list?page=1&size=30'+(q?'&status='+q:''));if(r.code!==200){$('#orders').innerHTML='<div class="empty">'+(r.message||'加载失败')+'</div>';return}const list=r.data.records||[];$('#orders').innerHTML=list.length?list.map(o=>{const st=status[o.status]||[o.statusDesc,''];return `<div class="order"><div><small>订单号</small><strong>${o.orderNo}</strong><small>${(o.createTime||'').replace('T',' ').slice(0,16)}</small></div><div><strong>${o.productName||'商品'}</strong><small>${o.isSeckill===1?'⚡ 秒杀订单':'普通订单'} · ×${o.quantity||1}</small></div><div class="price">¥${o.totalAmount}</div><div><span class="tag ${st[1]}">${st[0]}</span></div><div class="order-actions">${o.status===0?`<button class="btn" data-pay="${o.orderNo}">支付</button><button class="btn ghost" data-cancel="${o.orderNo}">取消</button>`:''}${o.status===1?`<button class="btn warn" data-refund="${o.orderNo}">退款</button>`:''}</div></div>`}).join(''):'<div class="empty">暂无订单</div>'}
    async function orderAction(type,no){const r=await request(`/order/${type}/${no}`,{method:'POST'});if(r.code===200){toast(type==='pay'?'支付成功':type==='refund'?'退款已受理':'订单已取消','success');loadOrders();loadProducts()}else toast(r.message||'操作失败','error')}
    async function loadAdmin(){if(!user||user.role!==1)return;const [p,o]=await Promise.all([request('/admin/product/list?page=1&size=100'),request('/admin/order/list?page=1&size=10')]);if(p.code===200){const list=p.data.records||[];$('#saleProduct').innerHTML=list.filter(x=>x.status===1).map(x=>`<option value="${x.id}">${x.name} · ¥${x.price}</option>`).join('');$('#adminProducts').innerHTML=`<table class="table"><thead><tr><th>商品</th><th>库存</th><th>状态</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.name}</td><td>${x.stock}</td><td>${x.status===1?'上架':'下架'}</td><td><button class="btn ghost" data-toggle="${x.id}" data-status="${x.status===1?0:1}">${x.status===1?'下架':'上架'}</button></td></tr>`).join('')}</tbody></table>`}if(o.code===200)$('#adminOrders').innerHTML=(o.data.records||[]).map(x=>`<div class="order"><div><strong>${x.orderNo}</strong><small>${x.productName||''}</small></div><div class="price">¥${x.totalAmount}</div><span class="tag">${x.statusDesc}</span>${x.status===1?`<button class="btn" data-ship="${x.orderNo}">发货</button>`:''}</div>`).join('')||'<div class="empty">暂无订单</div>'}
    async function createSale(){const body={productId:Number($('#saleProduct').value),seckillPrice:Number($('#salePrice').value),stockCount:Number($('#saleStock').value),startTime:$('#saleStart').value+':00',endTime:$('#saleEnd').value+':00',limitPerUser:Number($('#saleLimit').value||1)};if(!body.productId||!body.seckillPrice||!body.stockCount||!body.startTime||!body.endTime)return toast('请完整填写活动信息','error');const r=await request('/admin/seckill/create',{method:'POST',body:JSON.stringify(body)});if(r.code===200){toast('活动创建成功','success');loadSales()}else toast(r.message||'创建失败','error')}
    function showAuth(next){mode=next;$('#authTitle').textContent=next==='login'?'登录账号':'创建账号';$('#authNickname').classList.toggle('hidden',next==='login');$('#authPhone').classList.toggle('hidden',next==='login');$('#authSubmit').textContent=next==='login'?'登录':'注册';$('#authSwitch').textContent=next==='login'?'没有账号？去注册':'已有账号？去登录';show('authModal')}
    async function auth(){const u=$('#authUser').value.trim(),p=$('#authPassword').value;if(!u||!p)return toast('请输入账号和密码','error');if(mode==='register'){const r=await request('/user/register',{method:'POST',body:JSON.stringify({username:u,password:p,nickname:$('#authNickname').value.trim()||u,phone:$('#authPhone').value.trim()})});if(r.code!==200)return toast(r.message||'注册失败','error');toast('注册成功，请登录','success');showAuth('login');return}const r=await request('/user/login',{method:'POST',body:JSON.stringify({username:u,password:p})});if(r.code!==200)return toast(r.message||'登录失败','error');token=r.data.token;user=r.data.user;localStorage.setItem('seckill_token',token);hide('authModal');setUser();loadOrders();if(user.role===1)loadAdmin();toast('登录成功','success')}
    function tab(name){['products','seckill','orders','admin'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==name));$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='orders')loadOrders();if(name==='seckill')loadSales();if(name==='admin')user?.role===1?loadAdmin():toast('请使用管理员账号登录','error')}
    function countdownText(ms){if(ms<=0)return'00:00:00';const total=Math.floor(ms/1000),days=Math.floor(total/86400),hours=Math.floor(total%86400/3600),minutes=Math.floor(total%3600/60),seconds=total%60;return(days?days+'天 ':'')+[hours,minutes,seconds].map(v=>String(v).padStart(2,'0')).join(':')}
    function beginCountdown(list){window.__saleTimers?.forEach(clearInterval);window.__saleTimers=[];list.forEach((sale,index)=>{const timer=setInterval(()=>{const node=$('#sale-countdown-'+index),button=$('[data-seckill="'+sale.id+'"]'),now=Date.now(),start=new Date(sale.startTime).getTime(),end=new Date(sale.endTime).getTime();if(!node){clearInterval(timer);return}if(now<start){node.textContent='距开始 '+countdownText(start-now);if(button){button.disabled=true;button.textContent='即将开始'}}else if(now<end&&sale.remainStock>0){node.textContent='距结束 '+countdownText(end-now);node.classList.remove('ended');if(button){button.disabled=false;button.textContent='立即秒杀'}}else{node.textContent=sale.remainStock<1?'已售罄':'活动已结束';node.classList.add('ended');if(button){button.disabled=true;button.textContent=sale.remainStock<1?'已售罄':'已结束'}clearInterval(timer)}},1000);window.__saleTimers.push(timer)})}
    async function loadSales(){const r=await request('/seckill/list?page=1&size=20');if(r.code!==200)return;const list=r.data.records||[];$('#statDeals').textContent=list.filter(x=>x.status===1).length;$('#seckill').innerHTML=list.length?list.map((s,i)=>`<article class="sale"><div class="sale-media">${img(s.productImage,s.productName)}<span>⚡</span></div><div><h3>${s.productName||'秒杀商品'}</h3><div><span class="sale-price">¥${s.seckillPrice}</span><del>¥${s.originalPrice}</del></div><div class="sale-meta">剩余 ${s.remainStock} 件 · ${s.discount||''} · ${s.statusDesc||''}</div><div class="sale-countdown" id="sale-countdown-${i}">计算中…</div></div><button class="btn" data-seckill="${s.id}" ${s.status!==1||s.remainStock<1?'disabled':''}>${s.status===1?(s.remainStock<1?'已售罄':'立即秒杀'):(s.status===0?'即将开始':'已结束')}</button></article>`).join(''):'<div class="empty">暂无秒杀活动</div>';beginCountdown(list)}
    document.addEventListener('click',e=>{const t=e.target;if(t.dataset.tab)tab(t.dataset.tab);if(t.dataset.close)hide(t.dataset.close);if(t.id==='loginBtn'||t.id==='registerBtn')showAuth(t.id==='loginBtn'?'login':'register');if(t.id==='logoutBtn'){request('/user/logout',{method:'POST'});token=null;user=null;localStorage.removeItem('seckill_token');setUser();loadOrders();toast('已退出登录')}if(t.dataset.category!==undefined){category=t.dataset.category;$$('.chip').forEach(x=>x.classList.toggle('active',x===t));loadProducts()}if(t.dataset.detail)detail(t.dataset.detail);if(t.dataset.buy)buy(t.dataset.buy);if(t.dataset.qty){$('#quantity').value=Math.max(1,Number($('#quantity').value||1)+Number(t.dataset.qty))}if(t.dataset.seckill)doSale(t.dataset.seckill,t);if(t.dataset.pay)orderAction('pay',t.dataset.pay);if(t.dataset.cancel)orderAction('cancel',t.dataset.cancel);if(t.dataset.refund)orderAction('refund',t.dataset.refund);if(t.dataset.toggle)request(`/admin/product/status/${t.dataset.toggle}/${t.dataset.status}`,{method:'PUT'}).then(()=>{loadAdmin();loadProducts()});if(t.dataset.ship)request('/admin/order/ship/'+t.dataset.ship,{method:'PUT'}).then(()=>{toast('订单已发货','success');loadAdmin()})});
    $('#searchBtn').onclick=loadProducts;$('#search').onkeydown=e=>e.key==='Enter'&&loadProducts();$('#sort').onchange=loadProducts;$('#orderStatus').onchange=loadOrders;$('#refreshOrders').onclick=loadOrders;$('#refreshSale').onclick=loadSales;$('#refreshAdmin').onclick=loadAdmin;$('#createSale').onclick=createSale;$('#authSubmit').onclick=auth;$('#authSwitch').onclick=()=>showAuth(mode==='login'?'register':'login');$('#heroSeckill').onclick=()=>tab('seckill');boot();
  </script>
</body>
</html>
